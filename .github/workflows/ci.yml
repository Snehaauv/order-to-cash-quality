name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Split deliberately. The reconciler and the mutation harness have zero dependencies and no
  # browser, so they finish in seconds and give fast feedback on the thing that matters most. A
  # single job would make every contributor wait for a browser download to learn that a rule broke.
  reconcile:
    name: reconciliation + mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reconcile OMS against Analytics
        run: node bin/reconcile.js --now=2026-10-01T12:00:00Z

      # Fails the build if any injected defect survives. This is the guard against the suite
      # rotting silently - a check that stopped matching produces a clean run, which is
      # indistinguishable from clean data.
      - name: Mutation testing
        run: node bin/mutation.js

      - name: Regenerate the defect report and fail on drift
        run: |
          node bin/reconcile.js --now=2026-10-01T12:00:00Z --write-report
          git diff --exit-code DEFECT_REPORT.md || {
            echo "DEFECT_REPORT.md is out of date - run: npm run reconcile -- --write-report"
            exit 1
          }

  tests:
    name: playwright (data, api, ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Data and API layers
        run: npx playwright test --project=data --project=api

      # Allowed to fail the job but reported separately: the UI project depends on a third-party
      # demo site being up, which is not a signal about this repository.
      - name: UI layer
        run: npx playwright test --project=ui
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  ai-gate:
    name: generated rules must still clear the gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Runs offline from the committed cassette, so CI needs no API key and the accepted rule set
      # is reproducible. A change here shows up as a reviewable diff rather than silent drift.
      - name: Compile and verify LLM-proposed rules
        run: node ai/compile-rules.js
