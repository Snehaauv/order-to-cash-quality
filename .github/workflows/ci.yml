name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # No dependencies or browser needed, so this gives fast feedback.
  reconcile:
    name: reconciliation + mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reconcile OMS against Analytics
        run: node bin/reconcile.js --now=2026-10-01T12:00:00Z

      - name: Mutation testing
        run: node bin/mutation.js

      - name: Regenerate the defect report and fail on drift
        run: |
          node bin/reconcile.js --now=2026-10-01T12:00:00Z --write-report
          git diff --exit-code DEFECT_REPORT.md || {
            echo "DEFECT_REPORT.md is out of date - run: npm run reconcile -- --write-report"
            exit 1
          }

  tests:
    name: playwright (data, api, ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Data and API layers
        run: npx playwright test --project=data --project=api

      # Depends on a third-party demo site, so it does not fail the build.
      - name: UI layer
        run: npx playwright test --project=ui
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  ai-gate:
    name: generated rules must still clear the gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Runs offline from the saved response, so no API key is needed.
      - name: Compile and verify LLM-proposed rules
        run: node ai/compile-rules.js
